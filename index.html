  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ndo-radial:radial-gradient(125% 115% at 28% 0%,#0E1A33 0%,#0A1022 54%,#1D0F30 100%); /* @kind color */\n\n/* — Alias semánticos — */\n--surface-page:var(--tinta);\n--surface-page-gradient:var(--fondo-radial);\n--surface-card:var(--velo);\n--surface-card-hover:var(--velo-2);\n--surface-inverse:#f4f7fd;\n--border-subtle:var(--linea);\n--border-strong:var(--linea-fuerte);\n--text-strong:var(--blanco);\n--text-body:var(--texto);\n--text-muted:var(--texto-suave);\n--text-dim:var(--texto-tenue);\n--text-on-light:var(--tinta);\n--text-eyebrow:var(--eyebrow);\n--accent:var(--cian);\n--accent-gradient:var(--grad);\n--link:var(--eyebrow);\n--link-hover:var(--lima);\n}\n<\u002Fstyle>\n  <style>:root{\n/* — Familias — */\n--font-display:\"Chakra Petch\",\"Chakra Petch Fallback\",system-ui,sans-serif; /* logo, titulares, números */\n--font-body:\"Manrope\",system-ui,-apple-system,\"Segoe UI\",sans-serif;        /* cuerpo, interfaz */\n--font-mono:\"SFMono-Regular\",Menlo,Consolas,ui-monospace,monospace;         /* hex, specs, código */\n\n/* — Pesos — */\n--peso-display:600; /* @kind font */ /* Chakra SemiBold, peso del wordmark */\n--peso-display-bold:700; /* @kind font */\n--peso-regular:400; /* @kind font */\n--peso-medium:500; /* @kind font */\n--peso-semibold:600; /* @kind font */\n--peso-bold:700; /* @kind font */\n--peso-extrabold:800; /* @kind font */\n\n/* — Escala (handoff v2 · scale_reference_px) — */\n--size-display:60px;   /* 58–64 · Chakra 600 */\n--size-h1:40px;        /* Chakra 600 */\n--size-h2:30px;        /* 29–30 · Chakra 600 */\n--size-h3:22px;        /* Manrope 700 */\n--size-body-lg:18px;\n--size-body:17px;      /* 16–17 · Manrope 400 */\n--size-body-sm:15px;\n--size-caption:13px;   /* Manrope 500, mayúsculas */\n--size-eyebrow:11px;   /* Manrope 700, mayúsculas */\n\n/* — Interlineado — */\n--lh-display:1.05; /* @kind font */\n--lh-titulo:1.15; /* @kind font */\n--lh-texto:1.6; /* @kind font */\n--lh-compacto:1.35; /* @kind font */\n\n/* — Tracking — */\n--track-wordmark:.04em; /* @kind font */ /* nivel 'C' del logo */\n--track-display:-.5px; /* @kind font */\n--track-titulo:-.2px; /* @kind font */\n--track-caption:.16em; /* @kind font */\n--track-eyebrow:3px; /* @kind font */\n\n/* — Roles compuestos — */\n--text-display:var(--peso-display) var(--size-display)/var(--lh-display) var(--font-display);\n--text-h1:var(--peso-display) var(--size-h1)/var(--lh-titulo) var(--font-display);\n--text-h2:var(--peso-display) var(--size-h2)/var(--lh-titulo) var(--font-display);\n--text-h3:var(--peso-bold) var(--size-h3)/var(--lh-compacto) var(--font-body);\n--text-cuerpo:var(--peso-regular) var(--size-body)/var(--lh-texto) var(--font-body);\n--text-ui:var(--peso-semibold) var(--size-body-sm)/1.2 var(--font-body);\n}\n<\u002Fstyle>\n  <style>:root{\n/* Escala de espacio — base 4, con los pasos reales del brandbook (10/14/18/22/26/30/34) */\n--space-1:4px;\n--space-2:6px;\n--space-3:10px;\n--space-4:14px;\n--space-5:18px;\n--space-6:22px;\n--space-7:26px;\n--space-8:30px;\n--space-9:34px;\n--space-10:46px;\n--space-12:64px;\n--space-16:80px;\n\n/* Ritmo de página */\n--gutter:30px; /* @kind spacing */\n--gap-cards:14px; /* @kind spacing */\n--gap-tags:7px; /* @kind spacing */\n--seccion-y:34px; /* @kind spacing */\n--medida-texto:60ch; /* @kind spacing */\n--ancho-doc:860px; /* @kind spacing */\n--ancho-board:1040px; /* @kind spacing */\n--ancho-app:1440px; /* @kind spacing */\n}\n<\u002Fstyle>\n  <style>:root{\n/* — Radios — (contenedores del sistema de formas: r20–24; tarjetas de doc: 11–16) */\n--radio-xs:6px;\n--radio-sm:11px;\n--radio-md:12px;\n--radio-lg:16px;\n--radio-xl:24px;\n--radio-pill:999px;\n\n/* — Chaflán de marca — corte 1:3 (dx:dy), derivado de la uve del isotipo (33/110).\n   Un único chaflán por contenedor; badge = dos en esquinas opuestas. */\n--chaflan-card:polygon(0 0,calc(100% - 18px) 0,100% 54px,100% 100%,0 100%); /* @kind other */\n--chaflan-badge:polygon(8px 0,100% 0,100% calc(100% - 24px),calc(100% - 8px) 100%,0 100%,0 24px); /* @kind other */\n--chaflan-marco:polygon(0 0,calc(100% - 16px) 0,100% 48px,100% 100%,0 100%); /* @kind other */\n--pendiente-marca:1 / 3; /* @kind other */\n\n/* — Bordes — */\n--borde:1px solid var(--linea); /* @kind other */\n--borde-fuerte:1px solid var(--linea-fuerte); /* @kind other */\n--borde-trazo:2.5px; /* @kind other */\n\n/* — Sombras — (marca oscura: sombra difusa y profunda, nunca sombra corta tipo material) */\n--sombra-sm:0 2px 10px rgba(0,0,0,.25);\n--sombra-md:0 12px 34px rgba(0,0,0,.30);\n--sombra-lg:0 20px 60px rgba(0,0,0,.35);\n--glow-lima:0 0 0 1px rgba(189,234,68,.30),0 10px 30px rgba(189,234,68,.14); /* @kind shadow */\n--glow-cian:0 0 0 1px rgba(19,203,194,.30),0 10px 30px rgba(19,203,194,.14); /* @kind shadow */\n\n/* — Transparencia y blur — */\n--blur-panel:blur(14px); /* @kind other */\n--velo-patron:.10; /* @kind other */\n--velo-doodle:.4; /* @kind other */\n--velo-esfera-deco:.13; /* @kind other */\n\n/* — Movimiento — (timeline del isologo: handoff v2 · technical_specs.animation) */\n--ease-marca:cubic-bezier(.34,1.4,.5,1); /* @kind other */\n--ease-suave:cubic-bezier(.4,0,.2,1); /* @kind other */\n--dur-rapida:140ms; /* @kind other */\n--dur-media:280ms; /* @kind other */\n--dur-intro:580ms; /* @kind other */\n--dur-respiracion:1700ms; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* Base mínima de marca: fondo, tipografía por defecto y enlaces. */\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;font:var(--text-cuerpo);color:var(--text-body);background:var(--tinta);background-image:var(--fondo-radial);background-attachment:fixed;text-wrap:pretty;-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4{font-family:var(--font-display);font-weight:var(--peso-display);color:var(--text-strong);margin:0}\nh1{font-size:var(--size-h1);line-height:var(--lh-titulo);letter-spacing:var(--track-display)}\nh2{font-size:var(--size-h2);line-height:var(--lh-titulo);letter-spacing:var(--track-titulo)}\nh3{font-family:var(--font-bod le cx=\"24\" cy=\"24\" r=\"12\"><\u002Fcircle><circle cx=\"24\" cy=\"24\" r=\"2.4\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><path d=\"M24 6 v6 M24 36 v6 M6 24 h6 M36 24 h6\"><\u002Fpath><\u002Fsvg>\n          <p style=\"margin:0;font-size:18px;font-weight:800;color:#ffffff;line-height:1.3;\">Capta y filtra tus leads<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">Respuesta inmediata en DMs. Separa interesados reales de curiosos. El lead calificado llega a tu calendario con contexto.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px 16px;padding:22px 0;border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10);\">\n          <svg sc-camel-view-box=\"0 0 48 48\" style=\"width:32px;height:32px;color:#13CBC2;grid-row:span 2;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M26 7 L15 26 h8 L21 41 L33 21 h-8 Z\"><\u002Fpath><\u002Fsvg>\n          <p style=\"margin:0;font-size:18px;font-weight:800;color:#ffffff;line-height:1.3;\">Remata con paid<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">Solo cuando hay algo validado que multiplicar. El paid escala lo que las capas de abajo ya sostienen.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section data-screen-label=\"04\" style=\"padding:72px 24px;border-top:1px solid rgba(255,255,255,.10);display:flex;flex-direction:column;gap:28px;\">\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:18px;\">\n        <p style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-size:13px;letter-spacing:.2em;color:#6b7689;\">04 &middot; 06<\u002Fp>\n        <h2 style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.5px;color:#ffffff;text-wrap:pretty;\" data-words=\"1\">Detrás no hay herramientas sueltas. Hay un sistema trabajando.<\u002Fh2>\n        <div style=\"width:72px;height:3px;border-radius:2px;background:#13CBC2;\"><\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.55;color:#a7b2c6;text-wrap:pretty;\">Desde Artifizia hemos construido un sistema de agentes que impulsa tu crecimiento sin descanso. Tú recibes los resultados.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:12px;\">\n        <div data-light=\"0\" style=\"opacity:.28;transition:opacity .7s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;gap:7px;padding:17px 18px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.028);\"><div style=\"display:flex;align-items:baseline;gap:11px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.18em;color:#BDEA44;\">01<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:19px;line-height:1.1;color:#ffffff;\">Listo para usar<\u002Fspan><\u002Fdiv><p style=\"margin:0;font-size:15.5px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">No hay nada que montar, conectar ni mantener. El sistema ya está construido y rodado: entra a trabajar sobre tu marca desde el primer día.<\u002Fp><\u002Fdiv>\n        <div data-light=\"1\" style=\"opacity:.28;transition:opacity .7s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;gap:7px;padding:17px 18px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.028);\"><div style=\"display:flex;align-items:baseline;gap:11px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.18em;color:#BDEA44;\">02<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:19px;line-height:1.1;color:#ffffff;\">24/7<\u002Fspan><\u002Fdiv><p style=\"margin:0;font-size:15.5px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">No tiene turnos ni agenda. El comentario de las 21:40 se trabaja a las 21:40, no mañana a las nueve.<\u002Fp><\u002Fdiv>\n        <div data-light=\"2\" style=\"opacity:.28;transition:opacity .7s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;gap:7px;padding:17px 18px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.028);\"><div style=\"display:flex;align-items:baseline;gap:11px;\"><span style=\"font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.18em;color:#BDEA44;\">03<\u002Fspan><span style=\"font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:19px;line-height:1.1;color:#ffffff;\">Aprende<\u002Fspan><\u002Fdiv><p style=\"margin:0;font-size:15.5px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">Cada capa le deja algo a la siguiente. Lo que ocurre esta semana cambia lo que el sistema produce la que viene.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:9px;\">\n        <p style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:23px;line-height:1.22;letter-spacing:-.3px;color:#eaf0fb;text-wrap:pretty;\" data-words=\"1\">Una tendencia del lunes acaba siendo una venta del viernes.<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:#6b7689;text-wrap:pretty;\">Así se ve por dentro, en una semana cualquiera.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;\">\n            <div data-light=\"0\" style=\"position:relative;display:flex;gap:18px;opacity:.28;transition:opacity .7s cubic-bezier(.4,0,.2,1);\">\n              <div style=\"position:absolute;left:11px;top:26px;bottom:-16px;width:1.5px;background:linear-gradient(180deg,rgba(19,203,194,.55),rgba(19,203,194,.18));\"><\u002Fdiv>\n              <div style=\"position:relative;z-index:1;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #13CBC2;background:#0A1022;display:flex;align-items:center;justify-content:center;\">\n                <span style=\"width:8px;height:8px;border-radius:50%;background:#13CBC2;\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:26px;\">\n                <p style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#13CBC2;\">Lunes<\u002Fp>\n                <p style=\"margin:0;font-size:17px;font-weight:700;line-height:1.3;color:#eaf0fb;text-wrap:pretty;\">Detecta, produce y publica.<\u002Fp>\n                <p style=\"margin:0 0 4px;font-size:15px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">Un tema empieza a subir en tu nicho y tu versión está al aire el mismo día.<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:3px;padding-left:12px;border-left:1px solid rgba(255,255,255,.10);\"><div style=\"display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.4;color:#6b7689;\"><span style=\"flex:none;width:42px;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.06em;color:#BDEA44;opacity:.85;\">07:40<\u002Fspan><span style=\"text-wrap:pretty;\">El sistema ve la tendencia antes de que sea obvia.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.4;color:#6b7689;\"><span style=\"flex:none;width:42px;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.06em;color:#BDEA44;opacity:.85;\">12:15<\u002Fspan><span style=\"text-wrap:pretty;\">Entra en producción con tu voz y tu ángulo.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.4;color:#6b7689;\"><span style=\"flex:none;width:42px;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.06em;color:#BDEA44;opacity:.85;\">19:00<\u002Fspan><span style=\"text-wrap:pretty;\">Sale cuando tu audiencia está despierta.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-light=\"1\" style=\"position:relative;display:flex;gap:18px;opacity:.28;transition:opacity .7s cubic-bezier(.4,0,.2,1);\">\n              <div style=\"position:absolute;left:11px;top:26px;bottom:-16px;width:1.5px;background:linear-gradient(180deg,rgba(19,203,194,.55),rgba(19,203,194,.18));\"><\u002Fdiv>\n              <div style=\"position:relative;z-index:1;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #13CBC2;background:#0A1022;display:flex;align-items:center;justify-content:center;\">\n                <span style=\"width:8px;height:8px;border-radius:50%;background:#13CBC2;\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:26px;\">\n                <p style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#13CBC2;\">Martes &middot; Miércoles<\u002Fp>\n                <p style=\"margin:0;font-size:17px;font-weight:700;line-height:1.3;color:#eaf0fb;text-wrap:pretty;\">Conversa y separa.<\u002Fp>\n                <p style=\"margin:0 0 4px;font-size:15px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">El contenido abre DM. Cada uno se responde cuando llega, no mañana a las nueve.<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:3px;padding-left:12px;border-left:1px solid rgba(255,255,255,.10);\"><div style=\"display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.4;color:#6b7689;\"><span style=\"flex:none;width:42px;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.06em;color:#BDEA44;opacity:.85;\">21:40<\u002Fspan><span style=\"text-wrap:pretty;\">El de las 21:40 se trabaja a las 21:40.<\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.4;color:#6b7689;\"><span style=\"flex:none;width:42px;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.06em;color:#BDEA44;opacity:.85;\">09:12<\u002Fspan><span style=\"text-wrap:pretty;\">Tres preguntas: los que encajan entran a tu agenda con contexto.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-light=\"2\" style=\"position:relative;display:flex;gap:18px;opacity:.28;transition:opacity .7s cubic-bezier(.4,0,.2,1);\">\n              \n              <div style=\"position:relative;z-index:1;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #13CBC2;background:#0A1022;display:flex;align-items:center;justify-content:center;\">\n                <span style=\"width:8px;height:8px;border-radius:50%;background:#13CBC2;\"><\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;padding-bottom:4px;\">\n                <p style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#13CBC2;\">Jueves<\u002Fp>\n                <p style=\"margin:0;font-size:17px;font-weight:700;line-height:1.3;color:#eaf0fb;text-wrap:pretty;\">La llamada, y el círculo se cierra.<\u002Fp>\n                <p style=\"margin:0 0 4px;font-size:15px;line-height:1.5;color:#a7b2c6;text-wrap:pretty;\">Llegas con la conversación entera leída. Aparece una objeción nueva — y la semana que viene es contenido.<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:5px;margin-top:3px;padding-left:12px;border-left:1px solid rgba(255,255,255,.10);\"><div style=\"display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.4;color:#6b7689;\"><span style=\"flex:none;width:42px;font-family:'Chakra Petch',sans-serif;font-size:12px;letter-spacing:.06em;color:#BDEA44;opacity:.85;\">17:00<\u002Fspan><span style=\"text-wrap:pretty;\">Tú solo apareces aquí.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid rgba(19,203,194,.28);border-radius:12px;background:rgba(19,203,194,.055);\">\n        <p style=\"margin:0;font-size:16px;line-height:1.5;color:#eaf0fb;text-wrap:pretty;\">Eso es lo que separa un sistema de una herramienta: <strong style=\"color:#ffffff;font-weight:700;\">el sistema recuerda.<\u002Fstrong> La tendencia entra por un lado, la objeción de la llamada entra por el otro, y las dos vuelven a la producción de la semana siguiente. Cada semana empieza sabiendo más que la anterior.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:9px;\">\n        <p style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:23px;line-height:1.22;letter-spacing:-.3px;color:#eaf0fb;text-wrap:pretty;\" data-words=\"1\">Y puedes verlo trabajar.<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:#6b7689;text-wrap:pretty;\">La vista por dentro: qué está leyendo de tu nicho, qué temas tienen tracción esta semana y qué hooks ya se agotaron. No es un informe que llega el día 30 — está vivo.<\u002Fp>\n      <\u002Fdiv>\n<div data-reveal=\"1\" style=\"border:1px solid rgba(255,255,255,.18);border-radius:14px;background:#0A1022;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column;\">\n        <div style=\"height:48px;display:flex;align-items:center;gap:6px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.028);\">\n          <span style=\"width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);\"><\u002Fspan><span style=\"width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);\"><\u002Fspan>\n          <div style=\"margin-left:12px;display:flex;align-items:baseline;gap:3px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:16px;color:#ffffff;\"><span>Artifizia<\u002Fspan><span style=\"color:#13CBC2;\">OS<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.16em;color:#BDEA44;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#BDEA44;animation:latir 2s ease-in-out infinite;\"><\u002Fspan><span>EN VIVO<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;border-bottom:1px solid rgba(255,255,255,.10);\">\n          <button sc-camel-on-click=\"{{ tabDash }}\" style=\"flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-bottom:2px solid transparent;background:transparent;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;color:{{ tabDashColor }};border-bottom-color:{{ tabDashLine }};\"><svg sc-camel-view-box=\"0 0 48 48\" style=\"width:18px;height:18px;flex:none;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 24 h8 l4 -10 8 20 4 -10 h8\"><\u002Fpath><\u002Fsvg><span>Dashboard<\u002Fspan><\u002Fbutton>\n          <button sc-camel-on-click=\"{{ tabRadar }}\" style=\"flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-bottom:2px solid transparent;background:transparent;font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;color:{{ tabRadarColor }};border-bottom-color:{{ tabRadarLine }};\"><svg sc-camel-view-box=\"0 0 48 48\" style=\"width:18px;height:18px;flex:none;\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" strok a7b2c6;text-wrap:pretty;\">Posicionamiento, contenido y formatos, embudo de DM, captación y agenda, paid. Cada bloque con lo que está pasando hoy y el movimiento que haríamos primero.<\u002Fp>\n          <p style=\"margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6b7689;\">Vista de demostración<\u002Fp>\n        <\u002Fdiv>\n        \n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.10);\"><div style=\"display:flex;align-items:center;gap:11px;\"><img src=\"e7d6d62a-0c8c-4d5a-a330-996bd608b155\" alt=\"Artifizia\" style=\"height:30px;width:auto;\"><img src=\"465f855f-a1fe-43bb-ad1e-710ba9514b70\" alt=\"artifizia\" style=\"height:18px;width:auto;opacity:.9;\"><\u002Fdiv><p style=\"margin:0;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#BDEA44;text-align:right;\">AI Growth Partner<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 24px calc(18px + env(safe-area-inset-bottom));background:rgba(10,16,34,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.10);display:flex;justify-content:center;transition:transform .6s cubic-bezier(.4,0,.2,1);transform:translateY({{ ctaY }});\">\n    <div style=\"width:100%;max-width:382px;display:flex;\">\n      <x-import component-from-global-scope=\"ArtifiziaDesignSystem_cb58c9.Button\" variant=\"primary\" size=\"lg\" dc-props=\"{{ ctaProps }}\" hint-size=\"100%,56px\">Comencemos con el AI Scan<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\nclass Component extends DCLogic {\n  state = { tab: 'radar', verb: null, phase: null, showCta: false };\n  rootRef = React.createRef();\n  netRef = React.createRef();\n  panelRef = React.createRef();\n  lastRef = React.createRef();\n  verbTexts = {\n    1: 'Qué está funcionando en tu nicho, qué hacen tus competidores, qué tendencias vienen — antes de producir nada.',\n    2: 'Scripts, hooks y CTAs en tu voz, con volumen de test que un humano solo no alcanza. Tu tono mapeado, no plantillas.',\n    3: 'Respuesta inmediata en DMs. Separa interesados reales de curiosos. El lead calificado llega a tu calendario con contexto.'\n  };\n\n  componentDidMount() {\n    const root = this.rootRef.current; if (!root) return;\n    root.querySelectorAll('[data-words]').forEach(el => {\n      const words = el.textContent.split(/\\s+/).filter(Boolean);\n      el.textContent = '';\n      words.forEach((w, i) => {\n        const s = document.createElement('span');\n        s.textContent = w + (i < words.length - 1 ? ' ' : '');\n        s.style.cssText = 'display:inline-block;white-space:pre;opacity:0;transform:translateY(10px);transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1);transition-delay:' + (i * 45) + 'ms';\n        el.appendChild(s);\n      });\n    });\n    root.querySelectorAll('[data-reveal]').forEach(el => {\n      el.style.opacity = '0'; el.style.transform = 'translateY(24px)';\n      el.style.transition = 'opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1)';\n    });\n    this.io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        el.style.opacity = '1'; el.style.transform = 'none';\n        this.play(el);\n        this.io.unobserve(el);\n      });\n    }, { threshold: 0.18 });\n    root.querySelectorAll('[data-reveal]').forEach(el => this.io.observe(el));\n    if (this.lastRef.current) {\n      this.ioCta = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) this.set
